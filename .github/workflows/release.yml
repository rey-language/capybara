name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    name: Check release version and credentials
    runs-on: ubuntu-22.04
    outputs:
      npm: ${{ steps.npm.outputs.enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source_version="$(sed -n '/func capyVersion()/,/}/s/.*return "\([^"]*\)";.*/\1/p' src/capy/version.rey)"
          [[ "$RELEASE_TAG" == "v$source_version" ]] || {
            echo "::error::Release tag $RELEASE_TAG must match source version v$source_version"
            exit 1
          }
      - name: Check npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured; npm packages will be skipped."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CAPY_VERSION: ${{ github.ref_name }}
      CAPY_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch pinned Rey toolchain
        run: bash scripts/fetch-toolchain.sh
      - name: Build capy
        run: bash scripts/build.sh
      - name: Smoke test
        run: |
          ./build/capy --version
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/build/capy" init --name smoke
          "$GITHUB_WORKSPACE/build/capy" run
      - name: Package release archive
        run: bash scripts/package.sh "$CAPY_TARGET"
      - name: Validate packaged installer
        run: |
          install_home="$(mktemp -d)"
          HOME="$install_home" \
            CAPY_ARCHIVE="$PWD/build/dist/capy-v${CAPY_VERSION#v}-$CAPY_TARGET.tar.gz" \
            CAPY_SKIP_DEPS=1 \
            CAPY_SKIP_PROFILE=1 \
            bash install.sh
          HOME="$install_home" PATH="$install_home/.capy/bin:$PATH" capy --version
          HOME="$install_home" PATH="$install_home/.capy/bin:$PATH" rey --version
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capy-${{ matrix.target }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - build
      - brew
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate update manifest
        env:
          CAPY_VERSION: ${{ github.ref_name }}
        run: bash scripts/release-manifest.sh "$CAPY_VERSION" release-assets
      - name: Include installer
        run: |
          cp install.sh release-assets/install.sh
          chmod +x release-assets/install.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Capy ${{ github.ref_name }}
          body: |
            Capy ${{ github.ref_name }} is a patch release of the Capy CLI for
            the Rey programming language.

            ## Install

            ```sh
            curl -fsSL https://github.com/rey-language/capybara/releases/download/${{ github.ref_name }}/install.sh | CAPY_VERSION=${{ github.ref_name }} bash
            ```

            The installer downloads the archive for your platform, verifies its
            SHA-256 checksum, installs `capy` and the bundled Rey 0.3.1
            compiler/runtime/standard library under `~/.capy`, bootstraps
            clang/Xcode Command Line Tools when needed, migrates a legacy
            `~/.rey` installation, and configures your shell.

            ## Included

            - `capy` 0.1.1 CLI
            - Rey 0.3.1 compiler, runtime, and compatibility standard library
            - Release archives for macOS arm64 and x86-64, and Linux x86-64 and AArch64
            - `latest.toml` update manifest and SHA-256 checksums
            - `install.sh` standalone installer

            ## Verify

            ```sh
            capy --version
            capy doctor
            ```

            Read the [command reference](https://github.com/rey-language/capybara/blob/main/docs/COMMANDS.md)
            and [beta limits](https://github.com/rey-language/capybara#beta-limits).
          files: release-assets/*
          fail_on_unmatched_files: true

  npm:
    name: Publish npm packages
    needs:
      - release
      - preflight
    if: needs.preflight.outputs.npm == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: build/dist
          merge-multiple: true
      - name: Assemble npm packages
        env:
          CAPY_VERSION: ${{ github.ref_name }}
        run: bash scripts/package-npm.sh
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public build/npm/@capybara/darwin-arm64
          npm publish --access public build/npm/@capybara/darwin-x64
          npm publish --access public build/npm/@capybara/linux-x64
          npm publish --access public build/npm/@capybara/linux-arm64
      - name: Publish CLI package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public build/npm/@capybara/cli

  brew:
    name: Publish Homebrew formula artifact
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: build/dist
          merge-multiple: true
      - name: Render formula
        env:
          CAPY_VERSION: ${{ github.ref_name }}
        run: bash scripts/render-brew.sh "$CAPY_VERSION" build/dist build/capy.rb
      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: capy-homebrew-formula
          path: build/capy.rb
      - name: Note tap publishing integration point
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::notice::Set HOMEBREW_TAP_TOKEN and copy the capy.rb artifact into rey-language/homebrew-tap."
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is available; copy the capy.rb artifact into rey-language/homebrew-tap."
          fi
